<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Firda Amelia ❤️</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at center, #2b1029 0%, #0a0a0a 100%);
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow: hidden; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* === HALAMAN 1 === */
        #page1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            transition: opacity 0.5s ease-out; 
            padding: 20px;
        }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #ffb6c1; /* Warna pink romantis */
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.5);
            opacity: 0;
            animation: fadeIn 2s forwards 0.5s;
        }

        .subtitle {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeIn 2s forwards 1.5s;
        }

        .message {
            font-size: 1.2rem;
            font-weight: 300;
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeIn 2s forwards 2.5s;
        }

        .anniversary {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffb6c1;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeIn 2s forwards 3.5s;
        }

        .btn {
            background-color: rgba(255, 182, 193, 0.1);
            border: 2px solid #ffb6c1;
            color: #ffb6c1;
            padding: 12px 35px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            opacity: 0;
            animation: fadeIn 2s forwards 4.5s;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.3);
        }

        .btn:hover {
            background-color: #ffb6c1;
            color: #2b1029;
            box-shadow: 0 0 25px rgba(255, 182, 193, 0.8);
            transform: scale(1.05);
        }

        /* === HALAMAN 2: BINGKAI ROMANTIS === */
        #page2 {
            display: none; 
            opacity: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            transition: opacity 0.5s ease-in; 
        }

        .frame {
            /* Perubahan: Latar gradasi pink, border pink, dan efek cahaya */
            background: linear-gradient(135deg, #fff0f5, #ffe4e1);
            padding: 20px 20px 70px 20px; 
            border-radius: 20px;
            border: 3px solid #ff9ecd;
            box-shadow: 0 0 40px rgba(255, 158, 205, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.8);
            width: 90%;
            max-width: 650px;
            position: relative;
        }

        /* Perubahan: Teks Kenangan yang lebih romantis di bawah foto */
        .frame::after {
            content: "Kenangan Terindah Kita ❤️";
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #d81b60; /* Warna merah muda tua/magenta */
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        }

        .gallery-container {
            width: 100%;
            height: 320px;
            overflow: hidden;
            border-radius: 10px;
            position: relative;
            background-color: #ffebf0;
            border: 1px solid #ffd1dc;
        }

        .marquee-track {
            display: flex;
            height: 100%;
            width: max-content;
            animation: scrollGallery 25s linear infinite; 
        }

        .marquee-track img {
            height: 100%;
            width: auto;
            object-fit: cover;
            margin-right: 8px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scrollGallery {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); } 
        }

        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            z-index: -1;
        }
        
        @media (max-width: 600px) {
            .title { font-size: 2.5rem; }
            .subtitle { font-size: 1.8rem; }
            .message { font-size: 1rem; }
            .gallery-container { height: 220px; }
            .frame::after { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- 
      PENTING (SOAL MUSIK): 
      Jika file lagu kamu ada di satu folder yang sama persis dengan file index.html ini, gunakan:
      <audio id="bgm" src="janjisuci.mp3" loop></audio>
      
      TAPI, jika kamu menaruh lagunya di dalam folder bernama "music", gunakan kode di bawah ini: 
    -->
    <audio id="bgm" src="janjisuci.mp3" loop></audio>

    <div class="stars" id="stars"></div>

    <div id="page1">
        <h1 class="title">Teruntuk kekasihku, Firda Amelia</h1>
        <h2 class="subtitle">Dari Alvin Nouristy</h2>
        <p class="message">Selamat Hari GirlFriend Sayang</p>
        <p class="anniversary">Dan Selamat atas 1 tahun berlangsungnya kita ❤️</p>
        
        <button class="btn" id="startBtn">Buka Kenangan Kita</button>
    </div>

    <div id="page2">
        <div class="frame">
            <div class="gallery-container">
                <div class="marquee-track">
                    <!-- Ganti src dengan foto kamu -->
                    <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400&q=80" alt="Foto 1">
                    <img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=400&q=80" alt="Foto 2">
                    <img src="https://images.unsplash.com/photo-1494774112361-9c6bc76bb0de?w=400&q=80" alt="Foto 3">
                    <img src="https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=400&q=80" alt="Foto 4">
                    <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=400&q=80" alt="Foto 5">
                    
                    <!-- Duplikat agar bisa berjalan terus menerus -->
                    <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400&q=80" alt="Foto 1">
                    <img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=400&q=80" alt="Foto 2">
                    <img src="https://images.unsplash.com/photo-1494774112361-9c6bc76bb0de?w=400&q=80" alt="Foto 3">
                    <img src="https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=400&q=80" alt="Foto 4">
                    <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=400&q=80" alt="Foto 5">
                </div>
            </div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        const bgm = document.getElementById('bgm');

        startBtn.addEventListener('click', function() {
            // Perintah memutar lagu
            bgm.play().catch(error => {
                alert("Lagu tidak ditemukan! Pastikan nama file adalah janjisuci.mp3 dan lokasinya benar.");
                console.log(error);
            });

            page1.style.opacity = '0';

            setTimeout(() => {
                page1.style.display = 'none';
                page2.style.display = 'flex';
                
                setTimeout(() => {
                    page2.style.opacity = '1';
                }, 50);
            }, 500); 
        });

        function createStars() {
            const starsContainer = document.getElementById('stars');
            for(let i = 0; i < 60; i++) {
                const star = document.createElement('div');
                star.style.position = 'absolute';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.backgroundColor = i % 2 === 0 ? '#ffffff' : '#ffb6c1';
                star.style.borderRadius = '50%';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.opacity = Math.random();
                star.style.animation = `twinkle ${Math.random() * 3 + 2}s infinite alternate`;
                starsContainer.appendChild(star);
            }
        }
        
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes twinkle {
                0% { opacity: 0.2; transform: scale(0.8); }
                100% { opacity: 1; transform: scale(1.5); }
            }
        `;
        document.head.appendChild(style);
        
        createStars();
    </script>
</body>
</html>
