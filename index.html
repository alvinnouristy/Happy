<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Firda Amelia ❤️</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at center, #2e1529 0%, #0a0307 100%);
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow: hidden; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* === HALAMAN 1 === */
        #page1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            transition: opacity 0.8s ease-out; 
            padding: 20px;
            z-index: 10;
            position: absolute;
        }

        .title-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px; 
            margin-bottom: 5px;
            opacity: 0;
            animation: fadeIn 2.5s forwards 0.5s;
        }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #ffb6c1; 
            text-shadow: 0 0 20px rgba(255, 182, 193, 0.8);
            margin: 0;
        }

        /* Bingkai Mini tanpa garis */
        .mini-profile {
            position: relative;
            width: 90px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-photo {
            position: absolute;
            width: 80%; 
            height: 80%;
            object-fit: cover;
            border-radius: 50%; 
            z-index: 1; 
            top : 30%;
            transform: translateX(-10%);
        }

        .profile-frame {
            position: absolute;
            width: 140%;
            height: 140%;
            top: -10%; 
            z-index: 2; 
            pointer-events: none;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.5));
        }

        .subtitle {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeIn 2s forwards 1.5s;
        }

        .message {
            font-size: 1.2rem;
            font-weight: 300;
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeIn 2s forwards 2.5s;
        }

        .anniversary {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ff9ecd;
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeIn 2s forwards 3.5s;
        }

        .btn {
            background-color: rgba(255, 182, 193, 0.1);
            border: 2px solid #ffb6c1;
            color: #ffb6c1;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            opacity: 0;
            animation: fadeInPulse 2.5s forwards 4.5s;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.3);
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            background-color: #ffb6c1;
            color: #2e1529;
            box-shadow: 0 0 30px rgba(255, 182, 193, 0.9);
            transform: scale(1.08);
        }

        /* === HALAMAN 2: BINGKAI ROMANTIS === */
        #page2 {
            display: none; 
            opacity: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            transition: opacity 0.8s ease-in; 
            z-index: 10;
            position: absolute; 
        }

        .frame-wrapper {
            position: relative;
            width: 90%;
            max-width: 650px;
            animation: floatFrame 6s ease-in-out infinite alternate;
        }

        .frame {
            background: linear-gradient(135deg, #fff0f5, #ffe4e1);
            padding: 40px 30px 90px 30px; 
            border-radius: 15px;
            border: 8px double #ff9ecd;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 0 15px rgba(255, 255, 255, 0.9);
            width: 100%;
            position: relative;
        }

        .frame::after {
            content: "Kenangan Terindah Kita ❤️";
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #c2185b;
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.8);
        }

        .corner-image {
            position: absolute;
            width: 220px; 
            height: auto;
            z-index: 15;
            pointer-events: none;
            filter: drop-shadow(0 5px 8px rgba(0,0,0,0.4));
        }

        .img-tl { top: -55px; left: -55px; transform: rotate(180deg); }
        .img-tr { top: -55px; right: -55px; transform: scaleX(-1) rotate(180deg); }
        .img-bl { bottom: -55px; left: -55px; transform: scaleY(-1) rotate(180deg); }
        .img-br { bottom: -55px; right: -55px; transform: scale(-1, -1) rotate(180deg); }

        /* === GALERI FOTO === */
        .gallery-container {
            width: 100%;
            height: 340px;
            overflow: hidden;
            border-radius: 10px;
            position: relative;
            background-color: #2b1029;
            border: 1px solid #ffb6c1;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .marquee-track {
            display: flex;
            align-items: center;
            height: 100%;
            width: max-content;
            animation: scrollGallery 25s linear infinite; 
            padding: 0 10px;
        }

        .marquee-track img {
            height: 90%;
            width: auto;
            object-fit: cover;
            margin-right: 15px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            border: 3px solid white; 
        }

        /* === EFEK BINTANG & KELOPAK BERJATUHAN === */
        .background-fx {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            z-index: 1; 
            pointer-events: none;
            overflow: hidden;
        }

        .falling-star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.8);
        }

        .falling-image {
            position: absolute;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.4));
        }

        /* === ANIMASI === */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInPulse {
            0% { opacity: 0; transform: translateY(20px) scale(0.9); }
            50% { opacity: 1; transform: translateY(0) scale(1.05); box-shadow: 0 0 20px rgba(255, 182, 193, 0.8); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes scrollGallery {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); } 
        }

        @keyframes floatFrame {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-15px); }
        }

        @keyframes starFall {
            0% { transform: translateY(-10vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) translateX(-10vw); opacity: 0; }
        }

        @keyframes imageFall {
            0% { transform: translateY(-10vh); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh); opacity: 0; }
        }
        
        @media (max-width: 600px) {
            .title-group { flex-direction: column-reverse; gap: 10px; margin-bottom: 15px; } 
            .title { font-size: 3rem; }
            .subtitle { font-size: 1.6rem; }
            .anniversary { font-size: 1rem; }
            .gallery-container { height: 250px; }
            .frame { padding: 25px 15px 70px 15px; border-width: 5px; }
            .frame::after { font-size: 1.8rem; bottom: 15px; }
            .corner-image { width: 140px; } 
            .img-tl { top: -35px; left: -35px; }
            .img-tr { top: -35px; right: -35px; }
            .img-bl { bottom: -35px; left: -35px; }
            .img-br { bottom: -35px; right: -35px; }
        }
    </style>
</head>
<body>

    <audio id="bgm" loop>
        <source src="music/janjisuci.dat" type="audio/mpeg">
    </audio>

    <div class="background-fx" id="bg-fx"></div>

    <div id="page1">
        
        <div class="title-group">
            <h1 class="title">Teruntuk kekasihku, Firda Amelia</h1>
            
            <div class="mini-profile">
                <img src="photo/firda.jpeg" class="profile-photo" alt="Foto Firda">
                <img src="assets/bingkaifirda.png" class="profile-frame" alt="Bingkai Mini">
            </div>
        </div>

        <h2 class="subtitle">Dari Alvin Nouristy</h2>
        <p class="message">"Terima kasih sudah menjadi bagian penting dalam hidupku"</p>
        <p class="anniversary">Selamat Hari GirlFriend Sayang</p>
        <p class="anniversary">Selamat atas 1 tahun berlangsungnya Hubungan kita ❤️</p>

        <button class="btn" id="startBtn">Buka Kenangan Kita</button>
    </div>

    <!-- HALAMAN 2 -->
    <div id="page2">
        <div class="frame-wrapper">
            
            <img src="assets/hiasan-bingkai.png" class="corner-image img-tl" alt="Hiasan Sudut">
            <img src="assets/hiasan-bingkai.png" class="corner-image img-tr" alt="Hiasan Sudut">
            <img src="assets/hiasan-bingkai.png" class="corner-image img-bl" alt="Hiasan Sudut">
            <img src="assets/hiasan-bingkai.png" class="corner-image img-br" alt="Hiasan Sudut">

            <div class="frame">
                <div class="gallery-container">
                    <div class="marquee-track">
                        
                        <img src="photo/foto1.jpeg" alt="Foto 1">
                        <img src="photo/foto2.JPG" alt="Foto 2">
                        <img src="photo/foto3.jpeg" alt="Foto 3">
                        <img src="photo/foto4.jpeg" alt="Foto 4">
                        <img src="photo/foto5.jpeg" alt="Foto 5">
                        <img src="photo/foto6.jpeg" alt="Foto 6">

                        <img src="photo/foto1.jpeg" alt="Foto 1">
                        <img src="photo/foto2.JPG" alt="Foto 2">
                        <img src="photo/foto3.jpeg" alt="Foto 3">
                        <img src="photo/foto4.jpeg" alt="Foto 4">
                        <img src="photo/foto5.jpeg" alt="Foto 5">
                        <img src="photo/foto6.jpeg" alt="Foto 6">
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        const bgm = document.getElementById('bgm');

        startBtn.addEventListener('click', function() {
            bgm.play().catch(error => { console.log("Audio play error:", error); });
            page1.style.opacity = '0';
            setTimeout(() => {
                page1.style.display = 'none';
                page2.style.display = 'flex';
                setTimeout(() => { page2.style.opacity = '1'; }, 50);
            }, 800); 
        });

        function createFallingStars() {
            const container = document.getElementById('bg-fx');
            for(let i = 0; i < 40; i++) {
                const star = document.createElement('div');
                star.className = 'falling-star';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 120 + 'vw';
                star.style.backgroundColor = i % 3 === 0 ? '#ffb6c1' : '#ffffff';
                const duration = Math.random() * 10 + 5; 
                const delay = Math.random() * -20; 
                star.style.animation = `starFall ${duration}s linear ${delay}s infinite`;
                container.appendChild(star);
            }
        }

        function createFallingImages() {
            const container = document.getElementById('bg-fx');
            for(let i = 0; i < 80; i++) { 
                const petalImg = document.createElement('img');
                petalImg.src = 'assets/kelopak.png';
                petalImg.className = 'falling-image';
                petalImg.style.left = (Math.random() * 120 - 10) + 'vw'; 
                const size = Math.random() * 20 + 15; 
                petalImg.style.width = size + 'px';
                petalImg.style.height = 'auto';
                const duration = Math.random() * 6 + 5; 
                const delay = Math.random() * -15; 
                petalImg.style.animation = `imageFall ${duration}s linear ${delay}s infinite`;
                container.appendChild(petalImg);
            }
        }

        createFallingStars();
        createFallingImages();
    </script>
</body>
</html>
